:root{--teal:#002B3A;--teal2:#0E3A4A;--acc:#2F6F86;--soft:#7FA6B5;--bg:#F3F5F7;--card:#FFFFFF;--line:#C9CFD6;--track:#E3E7EB;--beige:#E9E1CF;--beigeb:#BFB396;--muted:#4A5A63}
*{box-sizing:border-box}
body{margin:0;font-family:"JW","thmanyah sans",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--teal);line-height:1.6}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
header{background:var(--teal);color:#fff;padding:18px 0 22px}
.logo{width:110px;height:auto;display:block;margin-bottom:8px}
h1{margin:0;font-size:clamp(24px,5vw,34px)}
.badge{display:inline-block;border:1px solid #8FA9B4;color:#DDE6EA;border-radius:99px;padding:2px 12px;font-size:12px;margin-top:8px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;margin-top:16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--teal2);border-radius:14px;padding:10px 12px}
.kpi b{display:block;font-size:24px;color:#fff}.kpi span{font-size:12px;color:#C9D6DC}
.kpi img{width:22px;height:22px;float:left}
.notice{background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--teal);border-radius:12px;padding:10px 14px;margin:14px 0;font-size:13px}
.notice.err{background:#FBE3DE;border-color:#B5523F;color:#6E2A1E;font-weight:700}
.hidden{display:none!important}
button,select,input,textarea{font:inherit;color:var(--teal)}
button{border:1px solid var(--teal);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;min-height:42px}
button.pri{background:var(--beige);border-color:var(--beigeb);font-weight:700}
button.link{border:none;background:none;color:var(--acc);text-decoration:underline;padding:4px;min-height:32px}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--soft);outline-offset:2px}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:16px 0}
.g{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:start;display:block;width:100%}
.g .t{font-weight:700;display:flex;align-items:center;gap:8px;min-height:28px}
.g img{width:26px;height:26px}
.track{height:8px;background:var(--track);border-radius:9px;overflow:hidden;margin-top:10px;display:flex}
.track i{display:block;height:100%}.d{background:var(--teal)}.p{background:var(--soft)}
.g small{font-size:12px;color:var(--muted)}
.sec{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 30px}
footer{font-size:12px;color:var(--muted);padding:0 0 30px}
dialog{border:none;border-radius:18px;padding:0;width:min(640px,calc(100vw - 16px));max-height:min(760px,calc(100vh - 24px));background:var(--card);color:var(--teal);box-shadow:0 20px 60px rgba(0,30,40,.3)}
dialog::backdrop{background:rgba(0,20,28,.45)}
.dh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
.dh h2{flex:1;font-size:17px;margin:0;line-height:1.4}
.db{padding:12px 14px;overflow:auto;max-height:calc(min(760px,100vh - 24px) - 64px)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tools input{flex:1;min-width:140px;border:1px solid var(--line);border-radius:10px;padding:8px}
.tools select,.st{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff;min-height:42px}
.it{display:flex;align-items:center;gap:8px;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.it .n{flex:1;font-weight:700;font-size:14px}
.it small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.pill{font-size:12px;border-radius:99px;padding:2px 10px;background:var(--track);white-space:nowrap}
.pill.s1{background:#D6E6EC}.pill.s2{background:var(--teal);color:#fff}
.pg{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:10px}
.tabs button{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;min-height:40px}
.tabs button[aria-selected=true]{border-bottom-color:var(--teal);font-weight:700}
dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:13px;margin:0}
dt{color:var(--muted)}dd{margin:0;white-space:pre-wrap;word-break:break-word}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}.iso{unicode-bidi:isolate}
.cm{background:#EEF1F4;border-radius:10px;padding:8px 10px;font-size:13px;margin-top:10px}
textarea{width:100%;min-height:140px;border:1px solid var(--line);border-radius:10px;padding:8px}
.big{font-size:18px;font-weight:700;margin:0 0 4px}
.muted{color:var(--muted);font-size:13px}
.card{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;font-size:13px}
@media(max-width:640px){dialog{width:calc(100vw - 12px)}}

header{padding:12px 0 14px}
.top{display:flex;align-items:center;gap:12px}.tt{flex:1}
.logo{width:100px;height:auto;margin:0}
h1{font-size:clamp(20px,5.4vw,30px);line-height:1.3}
.badge{margin-top:4px;font-size:11px;padding:1px 10px}
.hero{display:flex;gap:12px;align-items:center;margin-top:10px}
#ring{width:78px;height:78px;flex:none}
.kpis{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{padding:6px 10px;border-radius:12px;min-height:52px}
.kpi b{font-size:20px;line-height:1.2}.kpi span{font-size:11px;display:flex;align-items:center;gap:4px}
.kpi img{width:14px;height:14px;float:none}
.notice.sm{padding:6px 12px;margin:10px 0;font-size:12.5px}
.groups{grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
.g{padding:10px 12px;min-height:88px}
.g .t{font-size:14px;line-height:1.35;align-items:flex-start}
.g .t span{white-space:normal}
.g img{width:22px;height:22px;flex:none}
.track{margin-top:8px}
.g small{display:block;margin-top:4px;line-height:1.35}
.sec{margin:6px 0 14px}.sec button{width:100%}
footer{padding-bottom:16px}
@media(min-width:900px){.groups{grid-template-columns:repeat(4,1fr)}#ring{width:110px;height:110px}.kpi{min-height:64px}.kpi b{font-size:26px}.logo{width:120px}.sec button{width:auto}}
@media(max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}.hero{flex-direction:row}}
.tl{display:flex;flex-direction:column;gap:8px}.tl button{text-align:start}

@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.g.in{animation:up .2s ease-out both}
#ringD,#ringP{transition:stroke-dasharray .25s ease-out}
.track i{transition:width .25s ease-out}
dialog{opacity:1;transform:none;transition:opacity .18s ease-out,transform .18s ease-out,overlay .18s allow-discrete,display .18s allow-discrete}
dialog:not([open]){opacity:0;transform:translateY(8px)}
@starting-style{dialog[open]{opacity:0;transform:translateY(8px)}}
dialog::backdrop{transition:background .18s,overlay .18s allow-discrete,display .18s allow-discrete}
@starting-style{dialog[open]::backdrop{background:rgba(0,20,28,0)}}
#dBody>*{animation:up .18s ease-out both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after,dialog,dialog::backdrop{animation:none!important;transition:none!important}}

/* Glass */
body{background:radial-gradient(900px 600px at 85% -10%,#2F6F86 0%,transparent 60%),radial-gradient(800px 600px at -10% 40%,#9F9072 0%,transparent 55%),linear-gradient(160deg,#002B3A 0%,#0E3A4A 45%,#1d4f5f 100%) fixed;min-height:100vh}
header{background:rgba(255,255,255,.08);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border-bottom:1px solid rgba(255,255,255,.18)}
.kpi{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

function freshProgress(){var p={};PLAN.records.forEach(function(r){p[r.id]={status:itemByRow[r.row].status||"لم يبدأ",note:""};});return p;}
function load(){progress=freshProgress();
  try{var raw=window.localStorage.getItem(KEY);if(raw){var v=validate(JSON.parse(raw));if(v.ok)merge(v.data);else showMsg("تعذر قراءة الحفظ السابق: "+v.error,true);}}
  catch(e){setSaveErr("تعذر الوصول إلى تخزين المتصفح؛ التغييرات لن تُحفظ بعد إغلاق الصفحة. خذ نسخة احتياطية.");}}
function merge(d){Object.keys(d.records).forEach(function(id){progress[id]={status:d.records[id].status,note:d.records[id].note||""};});}
function snapshot(){return {schema:PLAN.schema,project:PLAN.project,savedAt:new Date().toISOString(),records:JSON.parse(JSON.stringify(progress))};}
function save(){try{window.localStorage.setItem(KEY,JSON.stringify(snapshot()));if(!window.localStorage.getItem(KEY))throw 0;$("saveErr").classList.add("hidden");return true;}
  catch(e){setSaveErr("لم يُحفظ التغيير في المتصفح (التخزين غير متاح أو ممتلئ). التغيير ظاهر الآن فقط وسيضيع عند الإغلاق — خذ نسخة احتياطية.");return false;}}
function setSaveErr(t){var e=$("saveErr");e.textContent=t;e.classList.remove("hidden");}
function showMsg(t,bad){var e=$("msg");e.textContent=t;e.classList.remove("hidden");e.classList.toggle("err",!!bad);}
function validate(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return {ok:false,error:"الملف ليس كائن JSON."};
  if(d.schema!==PLAN.schema)return {ok:false,error:"إصدار البنية غير مطابق (schema)."};
  if(d.project!==PLAN.project)return {ok:false,error:"الملف لمشروع آخر (project)."};
  if(!d.records||typeof d.records!=="object"||Array.isArray(d.records))return {ok:false,error:"لا توجد سجلات."};
  var ids=Object.keys(d.records);
  for(var i=0;i<ids.length;i++){var id=ids[i],r=d.records[id];
    if(!validIds[id])return {ok:false,error:"معرّف غير معروف: "+id};
    if(!r||typeof r!=="object")return {ok:false,error:"سجل غير صالح: "+id};
    if(STATUSES.indexOf(r.status)<0)return {ok:false,error:"حالة غير صالحة في "+id};
    if(r.note!=null&&typeof r.note!=="string")return {ok:false,error:"ملاحظة غير صالحة في "+id};
    if(r.note&&r.note.length>5000)return {ok:false,error:"ملاحظة طويلة جدًا في "+id};}
  for(var k in validIds){if(!d.records[k])return {ok:false,error:"سجل ناقص: "+k};}
  return {ok:true,data:d};}
function importText(text){
  var d;try{d=JSON.parse(text);}catch(e){showMsg("فشل الاستيراد: الملف غير صالح. لم يتغير شيء.",true);return "invalid";}
  var v=validate(d);if(!v.ok){showMsg("فشل الاستيراد: "+v.error+" لم يتغير شيء.",true);return "invalid";}
  var done=0;Object.keys(d.records).forEach(function(k){if(d.records[k].status==="مكتمل")done++;});
  if(!window.confirm("سيستبدل الاستيراد سجلك الحالي بالكامل ("+PLAN.records.length+" تصميمًا، المكتمل في الملف: "+done+"). متابعة؟")){showMsg("أُلغي الاستيراد. لم يتغير شيء.");return "cancel";}
  progress=freshProgress();merge(v.data);var ok=save();renderMain();if(D.view)renderDialog();
  showMsg(ok?"تم الاستيراد والحفظ في هذا المتصفح.":"تم الاستيراد للعرض الحالي فقط — الحفظ فشل.",!ok);return ok?"ok":"nosave";}
function exportJSON(){var s=JSON.stringify(snapshot(),null,1);var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"application/json"}));
  a.download="متابعة تصميمات جواد "+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();return s;}
function counts(recs){var c={t:recs.length,d:0,p:0};recs.forEach(function(r){var s=progress[r.id].status;if(s==="مكتمل")c.d++;else if(s==="قيد التصميم")c.p++;});c.l=c.t-c.d;c.pct=c.t?Math.round(c.d*100/c.t):0;return c;}
function groups(){var g=[];PLAN.items.forEach(function(it){if(g.indexOf(it.group)<0)g.push(it.group);});return g;}
function recsOf(g){return PLAN.records.filter(function(r){return !g||itemByRow[r.row].group===g;});}
function renderMain(){
  var all=counts(PLAN.records);$("kTotal").textContent=all.t;$("kDone").textContent=all.d;$("kProg").textContent=all.p;$("kLeft").textContent=all.l;
  var C=2*Math.PI*62;$("ringD").setAttribute("stroke-dasharray",(C*all.d/all.t)+" "+C);$("ringP").setAttribute("stroke-dasharray",(C*(all.d+all.p)/all.t)+" "+C);$("ringT").textContent=all.pct+"%";
  var G=$("groups");var first=!G.children.length;
  groups().forEach(function(g,idx){var c=counts(recsOf(g));var b=G.querySelector('[data-group="'+g.replace(/"/g,'\\"')+'"]');
    if(!b){b=el("button","g"+(first?" in":""));b.type="button";b.setAttribute("data-group",g);if(first)b.style.animationDelay=(idx*40)+"ms";
      var t=el("div","t");if(GICON[g]){var im=document.createElement("img");im.alt="";im.src=GICON[g];t.appendChild(im);}t.appendChild(el("span",null,g));b.appendChild(t);
      var tr=el("div","track");tr.appendChild(el("i","d"));tr.appendChild(el("i","p"));b.appendChild(tr);b.appendChild(el("small"));
      b.addEventListener("click",function(){openGroup(g);});G.appendChild(b);}
    b.querySelector("i.d").style.width=(c.d*100/c.t)+"%";b.querySelector("i.p").style.width=(c.p*100/c.t)+"%";
    b.querySelector("small").textContent=c.d+" من "+c.t+" مكتمل · قيد التصميم "+c.p+" · "+c.pct+"%";});}
